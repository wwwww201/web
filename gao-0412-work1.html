<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>鲸鱼娘 · Whale Girl</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: "Microsoft YaHei", Arial, sans-serif;
    background: linear-gradient(180deg, #a8e6ff 0%, #d4f1ff 40%, #eaf9ff 100%);
    color: #1a4a6b;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* 背景泡泡 */
  .bubble {
    position: fixed;
    bottom: -120px;
    background: rgba(255,255,255,.45);
    border-radius: 50%;
    animation: rise linear infinite;
    pointer-events: none;
    z-index: 0;
  }
  @keyframes rise {
    0%   { transform: translateY(0) scale(1); opacity: .7; }
    100% { transform: translateY(-110vh) scale(1.3); opacity: 0; }
  }

  /* 顶部导航 */
  header {
    position: sticky;
    top: 0;
    z-index: 100;
    background: rgba(255,255,255,.75);
    backdrop-filter: blur(10px);
    height: 64px;
    padding: 0 40px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    box-shadow: 0 2px 16px rgba(100,180,220,.25);
  }
  .logo {
    font-size: 22px;
    font-weight: bold;
    color: #2b7bb9;
    letter-spacing: 1px;
  }
  .logo span { color: #ff8fb1; }
  nav a {
    color: #2b7bb9;
    text-decoration: none;
    margin-left: 26px;
    font-size: 15px;
    position: relative;
    transition: color .3s;
  }
  nav a:hover { color: #ff8fb1; }
  nav a::after {
    content: "";
    position: absolute;
    left: 0; bottom: -6px;
    width: 0; height: 2px;
    background: #ff8fb1;
    transition: width .3s;
  }
  nav a:hover::after { width: 100%; }

  /* 主视觉 */
  .hero {
    position: relative;
    z-index: 1;
    text-align: center;
    padding: 70px 20px 50px;
  }
  .whale {
    font-size: 90px;
    line-height: 1;
    display: inline-block;
    animation: swim 3s ease-in-out infinite;
    filter: drop-shadow(0 10px 20px rgba(80,160,210,.35));
  }
  @keyframes swim {
    0%, 100% { transform: translateY(0) rotate(-3deg); }
    50%      { transform: translateY(-14px) rotate(3deg); }
  }
  .hero h1 {
    font-size: 42px;
    margin: 18px 0 12px;
    color: #1a4a6b;
    text-shadow: 0 2px 0 #fff;
  }
  .hero h1 em {
    color: #ff8fb1;
    font-style: normal;
  }
  .hero p {
    font-size: 17px;
    color: #4a7fa5;
    margin-bottom: 30px;
  }
  .btn {
    display: inline-block;
    background: linear-gradient(135deg, #5bc6ff, #2b7bb9);
    color: #fff;
    border: none;
    padding: 13px 40px;
    font-size: 16px;
    border-radius: 30px;
    cursor: pointer;
    text-decoration: none;
    box-shadow: 0 8px 20px rgba(43,123,185,.35);
    transition: transform .2s, box-shadow .2s;
  }
  .btn:hover {
    transform: translateY(-3px);
    box-shadow: 0 14px 28px rgba(43,123,185,.45);
  }

  /* 卡片区 */
  .cards {
    position: relative;
    z-index: 1;
    max-width: 1080px;
    margin: 20px auto 60px;
    padding: 0 20px;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 26px;
  }
  .card {
    background: rgba(255,255,255,.85);
    border-radius: 18px;
    padding: 30px 24px;
    text-align: center;
    box-shadow: 0 6px 20px rgba(100,180,220,.18);
    border: 2px solid rgba(255,255,255,.9);
    transition: transform .25s, box-shadow .25s;
  }
  .card:hover {
    transform: translateY(-8px);
    box-shadow: 0 16px 32px rgba(100,180,220,.3);
  }
  .card .emoji { font-size: 42px; margin-bottom: 12px; display: block; }
  .card h3 { font-size: 19px; margin-bottom: 10px; color: #2b7bb9; }
  .card p { font-size: 14px; color: #5a8aa8; line-height: 1.7; }

  /* 页脚 */
  footer {
    position: relative;
    z-index: 1;
    text-align: center;
    padding: 30px 20px 40px;
    color: #6fa8c9;
    font-size: 14px;
  }
  footer .heart { color: #ff8fb1; }

  /* 响应式 */
  @media (max-width: 768px) {
    header { padding: 0 18px; }
    nav a { margin-left: 14px; font-size: 13px; }
    .hero h1 { font-size: 28px; }
    .whale { font-size: 66px; }
    .cards { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

  <!-- 背景泡泡（JS 生成） -->

  <header>
    <div class="logo">🐋 鲸鱼<span>娘</span></div>
    <nav>
      <a href="#">首页</a>
      <a href="#">关于</a>
      <a href="#">图鉴</a>
      <a href="#">留言</a>
    </nav>
  </header>

  <section class="hero">
    <div class="whale">🐋</div>
    <h1>你好呀，我是<em>鲸鱼娘</em></h1>
    <p>深海里的温柔守护者，今天也在等你来玩～</p>
    <a href="#" class="btn">和我一起潜水</a>
  </section>

  <section class="cards">
    <div class="card">
      <span class="emoji">💙</span>
      <h3>温柔性格</h3>
      <p>说话软软的，最喜欢在深海安静地唱歌给你听。</p>
    </div>
    <div class="card">
      <span class="emoji">🌊</span>
      <h3>深海居所</h3>
      <p>住在蔚蓝的深海，周围漂着闪闪发光的泡泡。</p>
    </div>
    <div class="card">
      <span class="emoji">🐚</span>
      <h3>小收藏</h3>
      <p>收集了好多漂亮的贝壳和海底的小秘密。</p>
    </div>
  </section>

  <footer>
    © 2026 鲸鱼娘 · Made with <span class="heart">♥</span>
  </footer>

<script>
  // 生成背景泡泡
  const body = document.body;
  for (let i = 0; i < 18; i++) {
    const b = document.createElement('div');
    b.className = 'bubble';
    const size = Math.random() * 40 + 12;
    b.style.width = size + 'px';
    b.style.height = size + 'px';
    b.style.left = Math.random() * 100 + 'vw';
    b.style.animationDuration = (Math.random() * 12 + 10) + 's';
    b.style.animationDelay = (Math.random() * 10) + 's';
    body.appendChild(b);
  }
</script>

</body>
</html>
